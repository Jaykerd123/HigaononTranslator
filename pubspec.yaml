name: Higa
description: "A Higaonon Language Translator"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.17.5
  provider: ^6.1.2
  flutter_spinkit: ^5.2.2
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  audio_waveforms: ^1.0.5
  flutter_tts: ^4.0.2
  speech_to_text: ^7.3.0
  shared_preferences: ^2.2.0
  firebase_storage: ^11.0.0
  audioplayers: ^6.0.0
  http: ^1.2.1
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_logo/logo_black.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
     - assets/sagiri.jpg
     - assets/teaparty.jpg
     - assets/avatar/
     - assets/app_logo/
     - assets/social_icons/
     - assets/dictionary.json
     - assets/dictionary-second.json
     - assets/sounds/
